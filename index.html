<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprunki Social - Bienvenido</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1033;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: #2a1a4f;
      border: 4px solid #ff4fd8;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 0 24px rgba(255, 79, 216, 0.4);
    }

    .logo {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2rem;
      color: #ffe066;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #d9d2f0;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: #ff4fd8;
      color: #fff;
      box-shadow: 0 4px 0 #b02c95;
    }

    .btn-secondary {
      background: #3d2a6b;
      color: #ffe066;
      box-shadow: 0 4px 0 #1f1438;
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #8f83b8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🎵</div>
    <h1>¡Bienvenido a Sprunki Social!</h1>
    <p>
      Un lugar para los fans de los Sprunkis.
      Crea tu cuenta, muestra tu favorito y envía mensajes a tus amigos.
    </p>

    <div class="buttons">
      <a class="btn btn-primary" href="registro.html">Crear cuenta</a>
      <a class="btn btn-secondary" href="login.html">Iniciar sesión</a>
    </div>

    <footer>Versión 0.1 · Hecho con amor por los fans</footer>
  </main>
</body>
</html>
